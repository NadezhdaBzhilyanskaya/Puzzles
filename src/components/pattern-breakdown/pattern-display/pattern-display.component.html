@for (row of colors; let x = $index; track "row"+x) {
    <div class="row">
      @for (color of row; let y = $index; track "cell"+y+color.str ) {
      <div
        [ngClass]="{'cell': true, 'highlighted': color.highlighted,'hidden': !color.show, 'white': color.dmc == 'None'}"
        [ngStyle]="{'background-color': color.str}" [title]="color.dmc" (click)="clicked.emit({color,x,y})">
      </div>
      }
    </div>
    }
